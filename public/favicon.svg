<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4" />
      <stop offset="50%" stop-color="#C8A85B" />
      <stop offset="100%" stop-color="#846826" />
    </linearGradient>
    <radialGradient id="favBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#123B2A" />
      <stop offset="80%" stop-color="#06160F" />
      <stop offset="100%" stop-color="#030C08" />
    </radialGradient>
  </defs>
  <!-- Base Disc -->
  <circle cx="32" cy="32" r="30" fill="url(#favBg)" stroke="url(#favGold)" stroke-width="2" />
  
  <!-- Pentagon Crest Silhouette -->
  <polygon points="32,8 52,22 44,48 20,48 12,22" fill="none" stroke="url(#favGold)" stroke-width="1.5" opacity="0.85" />
  
  <!-- Mosque Dome Contour -->
  <path d="M 18,39 C 18,30 24,24 32,20 C 40,24 46,30 46,39 Z" fill="url(#favGold)" opacity="0.9" />
  
  <!-- Golden Finial & Crescent -->
  <line x1="32" y1="14" x2="32" y2="20" stroke="url(#favGold)" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="32" cy="13" r="2.2" fill="url(#favGold)" />

  <!-- Base Bar -->
  <rect x="20" y="41" width="24" height="3" rx="1.5" fill="url(#favGold)" />
</svg>