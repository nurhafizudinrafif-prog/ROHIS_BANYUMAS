<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="dkwGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4" />
      <stop offset="50%" stop-color="#C8A85B" />
      <stop offset="100%" stop-color="#846826" />
    </linearGradient>
    <radialGradient id="dkwBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#143D2B" />
      <stop offset="70%" stop-color="#082015" />
      <stop offset="100%" stop-color="#04100A" />
    </radialGradient>
    <filter id="dkwGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Base Disc with Gold Rim -->
  <circle cx="100" cy="100" r="92" fill="url(#dkwBg)" stroke="url(#dkwGold)" stroke-width="2.5" filter="url(#dkwGlow)"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#dkwGold)" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Islamic Geometric Background Watermark -->
  <g opacity="0.12" stroke="url(#dkwGold)" stroke-width="1" fill="none">
    <polygon points="100,28 150,50 172,100 150,150 100,172 50,150 28,100 50,50"/>
    <polygon points="100,38 143,56 162,100 143,144 100,162 57,144 38,100 57,56"/>
  </g>

  <!-- Central Emblem: Crescent, Dawn Star, & Open Holy Quran on Rehal -->
  <g transform="translate(100, 88)">
    <!-- Radiant Crescent Moon -->
    <path d="M 0,-48 A 28,28 0 1,0 26,-8 A 22,22 0 1,1 0,-48 Z" fill="url(#dkwGold)" opacity="0.95"/>
    
    <!-- 8-Pointed Star of Guidance -->
    <path d="M 16,-28 L 20,-20 L 28,-20 L 22,-14 L 25,-6 L 17,-11 L 10,-6 L 13,-14 L 6,-20 L 14,-20 Z" fill="#FFFFFF"/>

    <!-- Open Quran Pages -->
    <path d="M 0,-2 C -15,-14 -34,-12 -42,-8 L -42,18 C -34,14 -15,12 0,22 C 15,12 34,14 42,18 L 42,-8 C 34,-12 15,-14 0,-2 Z" 
          fill="#FAF8F5" stroke="url(#dkwGold)" stroke-width="1.5"/>
    
    <!-- Page Binding Spine & Lines -->
    <line x1="0" y1="-2" x2="0" y2="22" stroke="url(#dkwGold)" stroke-width="2"/>
    <path d="M -8,3 Q -22,-3 -34,-1" stroke="#C8A85B" stroke-width="1" opacity="0.6" fill="none"/>
    <path d="M -8,9 Q -22,3 -34,5" stroke="#C8A85B" stroke-width="1" opacity="0.6" fill="none"/>
    <path d="M 8,3 Q 22,-3 34,-1" stroke="#C8A85B" stroke-width="1" opacity="0.6" fill="none"/>
    <path d="M 8,9 Q 22,3 34,5" stroke="#C8A85B" stroke-width="1" opacity="0.6" fill="none"/>

    <!-- Rehal (Wooden Book Stand) Base -->
    <path d="M -30,22 L -10,38 L -36,50" stroke="url(#dkwGold)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 30,22 L 10,38 L 36,50" stroke="url(#dkwGold)" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Official Division Tag Banner -->
  <rect x="36" y="148" width="128" height="24" rx="12" fill="#0A2217" stroke="url(#dkwGold)" stroke-width="1.5"/>
  <text x="100" y="164" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10.5" fill="url(#dkwGold)" letter-spacing="2">DIVISI DAKWAH</text>
</svg>
