<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="dkwGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#064E3B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#022C22" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="emeraldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="dkwDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#064E3B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#dkwGlow)" stroke="url(#emeraldBorder)" stroke-width="3" filter="url(#dkwDrop)"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#34D399" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Central Emblem: Crescent & Open Quran / Book -->
  <g transform="translate(100, 92)">
    <!-- Crescent Moon -->
    <path d="M 12,-38 A 32,32 0 1,0 36,8 A 26,26 0 1,1 12,-38 Z" fill="#FDE047" opacity="0.95"/>
    <!-- Central 8-pointed star -->
    <path d="M 20,-20 L 23,-13 L 30,-13 L 24,-8 L 27,-1 L 20,-5 L 14,-1 L 16,-8 L 11,-13 L 18,-13 Z" fill="#FFFFFF"/>
    <!-- Open Book / Al-Quran -->
    <path d="M 0,2 C -12,-8 -28,-6 -34,-2 L -34,22 C -28,18 -12,16 0,26 C 12,16 28,18 34,22 L 34,-2 C 28,-6 12,-8 0,2 Z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M 0,2 L 0,26" stroke="#047857" stroke-width="2"/>
    <!-- Quran bookmark ribbon -->
    <path d="M 0,26 L 0,38 L 4,34 L 8,38 L 8,24" fill="#FDE047"/>
  </g>

  <!-- Banner / Division Tag -->
  <rect x="34" y="142" width="132" height="24" rx="12" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
  <text x="100" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" letter-spacing="1.5">DIVISI DAKWAH</text>
</svg>
