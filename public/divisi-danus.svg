<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="dnsGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#78350F" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#261003" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="goldDnsBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="dnsDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#78350F" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#dnsGlow)" stroke="url(#goldDnsBorder)" stroke-width="3" filter="url(#dnsDrop)"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#FDE047" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Central Emblem: Islamic Geometric Hexagon / Golden Star & Economic Growth -->
  <g transform="translate(100, 92)">
    <!-- Outer Hexagon -->
    <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" fill="none" stroke="#FDE047" stroke-width="2"/>
    <!-- Growth Bars / Halal Prosperity Symbol -->
    <rect x="-18" y="2" width="6" height="14" rx="2" fill="#FBBF24"/>
    <rect x="-8" y="-8" width="6" height="24" rx="2" fill="#FDE047"/>
    <rect x="2" y="-18" width="6" height="34" rx="2" fill="#FFFFFF"/>
    <rect x="12" y="-28" width="6" height="44" rx="2" fill="#FDE047"/>
    <!-- Rising Arrow -->
    <path d="M -18,14 L 16,-26 M 6,-26 L 18,-26 L 18,-14" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Banner / Division Tag -->
  <rect x="36" y="142" width="128" height="24" rx="12" fill="#78350F" stroke="#FDE047" stroke-width="1.5"/>
  <text x="100" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" letter-spacing="1.5">DIVISI DANUS</text>
</svg>
