<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="dnsGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4" />
      <stop offset="50%" stop-color="#C8A85B" />
      <stop offset="100%" stop-color="#846826" />
    </linearGradient>
    <radialGradient id="dnsBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#143D2B" />
      <stop offset="70%" stop-color="#082015" />
      <stop offset="100%" stop-color="#04100A" />
    </radialGradient>
    <filter id="dnsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Base Disc with Gold Rim -->
  <circle cx="100" cy="100" r="92" fill="url(#dnsBg)" stroke="url(#dnsGold)" stroke-width="2.5" filter="url(#dnsGlow)"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#dnsGold)" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Geometric Watermark -->
  <g opacity="0.10" stroke="url(#dnsGold)" stroke-width="1" fill="none">
    <circle cx="100" cy="100" r="72"/>
    <polygon points="100,28 151,49 172,100 151,151 100,172 49,151 28,100 49,49"/>
  </g>

  <!-- Central Emblem: Shield of Independence & Geometric Coin of Barakah -->
  <g transform="translate(100, 88)">
    <!-- Golden Geometric Coin of Barakah (Dinar Syariah / Kemandirian) -->
    <circle cx="0" cy="2" r="32" fill="#0D2A1D" stroke="url(#dnsGold)" stroke-width="2.5"/>
    <circle cx="0" cy="2" r="26" fill="none" stroke="url(#dnsGold)" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- 8-Pointed Star of Prosperity / Barakah inside Coin -->
    <g fill="url(#dnsGold)" opacity="0.95">
      <polygon points="0,-16 4,-6 14,-10 10,0 20,4 10,8 14,18 4,14 0,24 -4,14 -14,18 -10,8 -20,4 -10,0 -14,-10 -4,-6" />
    </g>

    <!-- Center Emblem Starlet -->
    <circle cx="0" cy="2" r="4.5" fill="#FAF8F5"/>

    <!-- Scales of Equitable Trade (Timbangan Muamalah) Atop -->
    <g stroke="url(#dnsGold)" stroke-width="1.8" stroke-linecap="round" fill="none">
      <!-- Beam -->
      <line x1="-28" y1="-26" x2="28" y2="-26"/>
      <circle cx="0" cy="-26" r="3.5" fill="url(#dnsGold)"/>
      <line x1="0" y1="-32" x2="0" y2="-26"/>
      <!-- Left Pan -->
      <line x1="-28" y1="-26" x2="-36" y2="-12"/>
      <line x1="-28" y1="-26" x2="-20" y2="-12"/>
      <path d="M -38,-12 Q -28,-8 -18,-12 Z" fill="url(#dnsGold)" opacity="0.9"/>
      <!-- Right Pan -->
      <line x1="28" y1="-26" x2="20" y2="-12"/>
      <line x1="28" y1="-26" x2="36" y2="-12"/>
      <path d="M 18,-12 Q 28,-8 38,-12 Z" fill="url(#dnsGold)" opacity="0.9"/>
    </g>
  </g>

  <!-- Official Division Tag Banner -->
  <rect x="40" y="148" width="120" height="24" rx="12" fill="#0A2217" stroke="url(#dnsGold)" stroke-width="1.5"/>
  <text x="100" y="164" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10.5" fill="url(#dnsGold)" letter-spacing="2">DIVISI DANUS</text>
</svg>
