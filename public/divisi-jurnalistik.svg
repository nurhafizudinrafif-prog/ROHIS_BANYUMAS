<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="jrnGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4" />
      <stop offset="50%" stop-color="#C8A85B" />
      <stop offset="100%" stop-color="#846826" />
    </linearGradient>
    <radialGradient id="jrnBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#143D2B" />
      <stop offset="70%" stop-color="#082015" />
      <stop offset="100%" stop-color="#04100A" />
    </radialGradient>
    <filter id="jrnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Base Disc with Gold Rim -->
  <circle cx="100" cy="100" r="92" fill="url(#jrnBg)" stroke="url(#jrnGold)" stroke-width="2.5" filter="url(#jrnGlow)"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#jrnGold)" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Geometric Watermark -->
  <g opacity="0.10" stroke="url(#jrnGold)" stroke-width="1" fill="none">
    <circle cx="100" cy="100" r="70"/>
    <polygon points="100,28 151,49 172,100 151,151 100,172 49,151 28,100 49,49"/>
  </g>

  <!-- Central Emblem: Golden Qalam (Pen of Truth) & Media Document Parchment -->
  <g transform="translate(100, 88)">
    <!-- Illuminated Archival Parchment / Media Document -->
    <path d="M -30,-32 C -20,-36 20,-36 30,-32 C 34,-30 36,-24 36,-18 L 32,28 C 32,34 26,38 20,38 L -24,38 C -30,38 -34,34 -34,28 L -36,-18 C -36,-24 -34,-30 -30,-32 Z" 
          fill="#0B261A" stroke="url(#jrnGold)" stroke-width="1.8"/>
    
    <!-- Document Lines / Editorial Text Columns -->
    <line x1="-20" y1="-18" x2="16" y2="-18" stroke="url(#jrnGold)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="-20" y1="-10" x2="20" y2="-10" stroke="url(#jrnGold)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="-20" y1="-2" x2="20" y2="-2" stroke="url(#jrnGold)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="-20" y1="6" x2="12" y2="6" stroke="url(#jrnGold)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Lens Aperture / Shutter Ring (Documentary Photography) -->
    <circle cx="16" cy="18" r="12" fill="#113626" stroke="url(#jrnGold)" stroke-width="1.8"/>
    <circle cx="16" cy="18" r="7" fill="none" stroke="#FAF8F5" stroke-width="1.2"/>
    <circle cx="16" cy="18" r="3" fill="url(#jrnGold)"/>

    <!-- The Master Calligraphic Qalam (Pena Dakwah) Angled in Front -->
    <g transform="rotate(35 0 0)">
      <!-- Nib / Tip -->
      <polygon points="0,42 -3,32 3,32" fill="#FAF8F5"/>
      <line x1="0" y1="42" x2="0" y2="35" stroke="#846826" stroke-width="0.8"/>
      <!-- Pen Body -->
      <path d="M -4,32 L -4,-36 Q 0,-42 4,-36 L 4,32 Z" fill="url(#jrnGold)" stroke="#FFFFFF" stroke-width="0.8"/>
      <!-- Gold Bands -->
      <line x1="-4" y1="12" x2="4" y2="12" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="-4" y1="-12" x2="4" y2="-12" stroke="#FFFFFF" stroke-width="1.5"/>
      <!-- Nib Sparkle / Light of Ink -->
      <circle cx="0" cy="46" r="2.2" fill="#FAF8F5"/>
    </g>
  </g>

  <!-- Official Division Tag Banner -->
  <rect x="28" y="148" width="144" height="24" rx="12" fill="#0A2217" stroke="url(#jrnGold)" stroke-width="1.5"/>
  <text x="100" y="164" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="url(#jrnGold)" letter-spacing="1.8">DIVISI JURNALISTIK</text>
</svg>
