<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="hmsGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0E7490" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#082F49" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#A5F3FC" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <filter id="hmsDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0E7490" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#hmsGlow)" stroke="url(#cyanBorder)" stroke-width="3" filter="url(#hmsDrop)"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#67E8F9" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Central Emblem: Globe & Connection Nodes / Megaphone / Herald Beacon -->
  <g transform="translate(100, 92)">
    <!-- Globe Circle -->
    <circle cx="0" cy="-6" r="28" fill="none" stroke="#67E8F9" stroke-width="2" opacity="0.9"/>
    <!-- Latitude and Longitude lines -->
    <ellipse cx="0" cy="-6" rx="14" ry="28" fill="none" stroke="#A5F3FC" stroke-width="1.5" opacity="0.8"/>
    <line x1="-28" y1="-6" x2="28" y2="-6" stroke="#A5F3FC" stroke-width="1.5" opacity="0.8"/>
    <!-- Connection Nodes / Orbiting Dots -->
    <circle cx="-20" cy="-22" r="4" fill="#FFFFFF"/>
    <circle cx="20" cy="-22" r="4" fill="#FFFFFF"/>
    <circle cx="0" cy="22" r="4" fill="#FFFFFF"/>
    <line x1="-20" y1="-22" x2="0" y2="-6" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="20" y1="-22" x2="0" y2="-6" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="0" y1="22" x2="0" y2="-6" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2,2"/>
    <!-- Star on center -->
    <circle cx="0" cy="-6" r="5" fill="#FDE047"/>
  </g>

  <!-- Banner / Division Tag -->
  <rect x="36" y="142" width="128" height="24" rx="12" fill="#0E7490" stroke="#67E8F9" stroke-width="1.5"/>
  <text x="100" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" letter-spacing="1.5">DIVISI HUMAS</text>
</svg>
