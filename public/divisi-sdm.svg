<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="sdmGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#1E3A8A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="sdmDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E40AF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#sdmGlow)" stroke="url(#goldBorder)" stroke-width="3" filter="url(#sdmDrop)"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#60A5FA" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Central Emblem: Human Development / People & Star -->
  <g fill="#FFFFFF" opacity="0.95" transform="translate(100, 92)">
    <!-- Central leader figure -->
    <circle cx="0" cy="-28" r="10" fill="#93C5FD"/>
    <path d="M -16,4 C -16,-12 16,-12 16,4 C 16,14 -16,14 -16,4 Z" fill="#60A5FA"/>
    <!-- Left companion figure -->
    <circle cx="-26" cy="-20" r="7.5" fill="#BFDBFE" opacity="0.85"/>
    <path d="M -38,8 C -38,-5 -14,-5 -14,8 Z" fill="#3B82F6" opacity="0.85"/>
    <!-- Right companion figure -->
    <circle cx="26" cy="-20" r="7.5" fill="#BFDBFE" opacity="0.85"/>
    <path d="M 14,8 C 14,-5 38,-5 38,8 Z" fill="#3B82F6" opacity="0.85"/>
    <!-- Rising Star on top -->
    <path d="M 0,-44 L 2.5,-38 L 8.5,-38 L 3.5,-34 L 5.5,-28 L 0,-32 L -5.5,-28 L -3.5,-34 L -8.5,-38 L -2.5,-38 Z" fill="#FDE047"/>
  </g>

  <!-- Banner / Division Tag -->
  <rect x="36" y="142" width="128" height="24" rx="12" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="100" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" letter-spacing="1.5">DIVISI SDM</text>
</svg>
