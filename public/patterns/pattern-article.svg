<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Minimalist Editorial Grid & Architectural Geometric Lines (High Negative Space) -->
  <g stroke="#39b99a" stroke-width="0.5" stroke-opacity="0.65" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Clean Minimal Square Grid -->
    <rect x="20" y="20" width="80" height="80" stroke-opacity="0.35" />
    
    <!-- Fine 45-degree Angled Diamond Frame -->
    <polygon points="60,20 100,60 60,100 20,60" stroke-opacity="0.5" />
    
    <!-- Subtle Architectural Axis Marks -->
    <line x1="60" y1="0" x2="60" y2="12" />
    <line x1="60" y1="108" x2="60" y2="120" />
    <line x1="0" y1="60" x2="12" y2="60" />
    <line x1="108" y1="60" x2="120" y2="60" />

    <!-- Corner Alignment Crosses -->
    <line x1="0" y1="0" x2="10" y2="10" stroke-opacity="0.4" />
    <line x1="120" y1="0" x2="110" y2="10" stroke-opacity="0.4" />
    <line x1="0" y1="120" x2="10" y2="110" stroke-opacity="0.4" />
    <line x1="120" y1="120" x2="110" y2="110" stroke-opacity="0.4" />
  </g>

  <!-- Single Delicate Center Vertex -->
  <circle cx="60" cy="60" r="1.2" fill="#5fe3c2" fill-opacity="0.7" />
</svg>
