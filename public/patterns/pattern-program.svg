<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <defs>
    <linearGradient id="progNodes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0cf" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#00ddb8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="haloLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0cf" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f0cf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Halo Field in Center -->
  <circle cx="70" cy="70" r="28" fill="url(#haloLight)" />

  <!-- Connected Geometric Nodes & Lines -->
  <g stroke="url(#progNodes)" stroke-width="1.15" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Octagon Center Ring -->
    <polygon points="70,42 90,50 98,70 90,90 70,98 50,90 42,70 50,50" />
    
    <!-- Starburst connections from center to perimeter nodes -->
    <line x1="70" y1="42" x2="70" y2="0" />
    <line x1="90" y1="50" x2="140" y2="0" />
    <line x1="98" y1="70" x2="140" y2="70" />
    <line x1="90" y1="90" x2="140" y2="140" />
    <line x1="70" y1="98" x2="70" y2="140" />
    <line x1="50" y1="90" x2="0" y2="140" />
    <line x1="42" y1="70" x2="0" y2="70" />
    <line x1="50" y1="50" x2="0" y2="0" />

    <!-- Diamond Sub-Grid connecting midway nodes -->
    <polygon points="70,14 126,70 70,126 14,70" stroke-opacity="0.4" />
    
    <!-- Cross intersections for seamlessness -->
    <line x1="0" y1="0" x2="140" y2="140" stroke-opacity="0.25" />
    <line x1="140" y1="0" x2="0" y2="140" stroke-opacity="0.25" />
  </g>

  <!-- Small Glowing Points & Nodes (Network Vertices) -->
  <circle cx="70" cy="70" r="2" fill="#00f0cf" />
  <circle cx="70" cy="42" r="1.5" fill="#38bdf8" />
  <circle cx="90" cy="50" r="1.3" fill="#00ddb8" />
  <circle cx="98" cy="70" r="1.5" fill="#38bdf8" />
  <circle cx="90" cy="90" r="1.3" fill="#00ddb8" />
  <circle cx="70" cy="98" r="1.5" fill="#38bdf8" />
  <circle cx="50" cy="90" r="1.3" fill="#00ddb8" />
  <circle cx="42" cy="70" r="1.5" fill="#38bdf8" />
  <circle cx="50" cy="50" r="1.3" fill="#00ddb8" />

  <!-- Corner Anchor Nodes -->
  <circle cx="0" cy="0" r="2" fill="#00f0cf" />
  <circle cx="140" cy="0" r="2" fill="#00f0cf" />
  <circle cx="0" cy="140" r="2" fill="#00f0cf" />
  <circle cx="140" cy="140" r="2" fill="#00f0cf" />
</svg>
