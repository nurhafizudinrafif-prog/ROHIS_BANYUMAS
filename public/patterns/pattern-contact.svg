<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="contactGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ddb8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Calming Minimal Islamic Rosette & Peaceful Closing Geometry -->
  <g stroke="url(#contactGlow)" stroke-width="0.55" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Gentle Center 8-pointed Rosette -->
    <polygon points="80,56 86,70 100,74 88,82 88,96 80,88 72,96 72,82 60,74 74,70" stroke-opacity="0.55" />

    <!-- Thin Concentric Ring -->
    <circle cx="80" cy="80" r="36" stroke-dasharray="2 4" stroke-opacity="0.3" />

    <!-- Subtle Outer Border Accents -->
    <line x1="80" y1="0" x2="80" y2="16" stroke-opacity="0.25" />
    <line x1="80" y1="144" x2="80" y2="160" stroke-opacity="0.25" />
    <line x1="0" y1="80" x2="16" y2="80" stroke-opacity="0.25" />
    <line x1="144" y1="80" x2="160" y2="80" stroke-opacity="0.25" />
  </g>

  <!-- Single Soft Central Beacon -->
  <circle cx="80" cy="80" r="1.3" fill="#00f0cf" fill-opacity="0.65" />
</svg>
