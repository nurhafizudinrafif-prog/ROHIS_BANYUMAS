<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="aboutArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ddb8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#5fe3c2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- Architectural Islamic Geometric Grid & Diagonal Lattice -->
  <g stroke="url(#aboutArch)" stroke-width="1.15" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Grand Architectural Medallion -->
    <circle cx="80" cy="80" r="32" stroke-dasharray="3 3" stroke-opacity="0.5" />
    <polygon points="80,48 88,72 112,80 88,88 80,112 72,88 48,80 72,72" />
    <polygon points="57,57 80,68 103,57 92,80 103,103 80,92 57,103 68,80" stroke-opacity="0.65" />

    <!-- Outer Architectural Interlocking Square Lattice -->
    <rect x="32" y="32" width="96" height="96" stroke-opacity="0.4" />
    <rect x="32" y="32" width="96" height="96" transform="rotate(45 80 80)" stroke-opacity="0.4" />

    <!-- Diagonal Architectural Light Traces -->
    <line x1="0" y1="0" x2="160" y2="160" stroke-opacity="0.3" stroke-dasharray="4 4" />
    <line x1="160" y1="0" x2="0" y2="160" stroke-opacity="0.3" stroke-dasharray="4 4" />

    <!-- Corner Structural Arches for Seamless Tiling -->
    <!-- Top-Left -->
    <path d="M 0,32 A 32,32 0 0,0 32,0" stroke-opacity="0.5" />
    <!-- Top-Right -->
    <path d="M 128,0 A 32,32 0 0,0 160,32" stroke-opacity="0.5" />
    <!-- Bottom-Left -->
    <path d="M 0,128 A 32,32 0 0,1 32,160" stroke-opacity="0.5" />
    <!-- Bottom-Right -->
    <path d="M 128,160 A 32,32 0 0,1 160,128" stroke-opacity="0.5" />

    <!-- Interconnecting Border Links -->
    <line x1="80" y1="0" x2="80" y2="48" />
    <line x1="80" y1="112" x2="80" y2="160" />
    <line x1="0" y1="80" x2="48" y2="80" />
    <line x1="112" y1="80" x2="160" y2="80" />
  </g>

  <!-- Architectural Anchor Nodes -->
  <circle cx="80" cy="80" r="2" fill="#5fe3c2" />
  <circle cx="80" cy="32" r="1.4" fill="#00ddb8" />
  <circle cx="80" cy="128" r="1.4" fill="#00ddb8" />
  <circle cx="32" cy="80" r="1.4" fill="#00ddb8" />
  <circle cx="128" cy="80" r="1.4" fill="#00ddb8" />
</svg>
